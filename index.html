<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="Fija Download webpage as PDF en la barra de herramientas de Chrome y guarda cualquier página web como PDF."
    >
    <title>¡Download webpage as PDF ya está instalada! Así puedes empezar.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/pdf-icon-32.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">
          <span class="headline-main">Download webpage as PDF <span class="headline-keep">ya está instalada.&nbsp;🎉</span></span>
          <span class="headline-sub">Así puedes empezar.</span>
        </h1>
      </header>

      <section class="instruction" aria-labelledby="pin-step">
        <h2 class="step" id="pin-step">
          Abre Extensiones (1) en la esquina superior derecha de Chrome. Luego haz clic en el icono de fijar (2) junto a Download webpage as PDF.
        </h2>
        <figure class="browser-shot">
          <img src="assets/pin-extension.png" alt="Abre Extensiones de Chrome y fija Download webpage as PDF">
        </figure>
      </section>

      <section class="instruction instruction--last" aria-labelledby="open-step">
        <h2 class="step" id="open-step">
          ¡Listo! Haz clic en el icono de PDF (3) cada vez que quieras guardar una página web.
        </h2>
        <figure class="browser-shot">
          <img src="assets/open-extension.png" alt="Haz clic en el icono de Download webpage as PDF en la barra de herramientas de Chrome">
        </figure>
      </section>
    </main>
  </body>
</html>
