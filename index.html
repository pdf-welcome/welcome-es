<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="Fija «Página web a PDF» en la barra de herramientas de Chrome y guarda cualquier página web como PDF."
    >
    <title>¡«Página web a PDF» ya está instalada! Te explicamos cómo empezar.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/pdf-icon-32.png">
    <link rel="stylesheet" href="styles.css?v=es-label-1">
  </head>
  <body>
    <main class="page">
      <header class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">
          <span class="headline-main">¡«Página web a PDF» <span class="headline-keep">ya está instalada!&nbsp;🎉</span></span>
          <span class="headline-sub">Te explicamos cómo empezar.</span>
        </h1>
      </header>

      <section class="instruction" aria-labelledby="pin-step">
        <h2 class="step" id="pin-step">
          Abre el menú Extensiones (1) en la esquina superior derecha de Chrome. Luego haz clic en el icono Fijar (2) junto a «Página web a PDF».
        </h2>
        <figure class="browser-shot browser-shot--localized">
          <img src="assets/pin-extension.png" alt="Menú Extensiones de Chrome abierto con la opción de fijar «Página web a PDF»">
          <svg class="localized-label" viewBox="0 0 2600 1193" aria-hidden="true" focusable="false">
            <rect x="1848" y="463" width="335" height="42" fill="#fafbfc" />
            <text x="1854" y="496" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="26">Página web a PDF</text>
          </svg>
        </figure>
      </section>

      <section class="instruction instruction--last" aria-labelledby="open-step">
        <h2 class="step" id="open-step">
          ¡Listo! Haz clic en el icono de PDF (3) cada vez que quieras guardar una página web.
        </h2>
        <figure class="browser-shot">
          <img src="assets/open-extension.png" alt="Icono de «Página web a PDF» en la barra de herramientas de Chrome">
        </figure>
      </section>
    </main>
  </body>
</html>
